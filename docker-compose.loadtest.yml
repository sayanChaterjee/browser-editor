# Overlay for load tests: caps each app container near a small production instance
# so results reflect constrained hardware rather than a fast laptop.
# Usage: docker compose -f docker-compose.yml -f docker-compose.loadtest.yml up -d --build --wait

x-limits: &limits
  cpus: "0.5"
  mem_limit: 512m

services:
  api-gateway:
    <<: *limits
    environment:
      # k6 simulates distinct users via X-Forwarded-For; trust one hop so the gateway sees them.
      - TRUST_PROXY_HOPS=1
      # Test setup signs up hundreds of users; keep the limiter out of the measurement.
      - RATE_LIMIT_AUTH_PER_15_MINUTES=100000
  auth-service:
    <<: *limits
  user-service:
    <<: *limits
  code-service:
    <<: *limits
