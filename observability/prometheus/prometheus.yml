# Local development only: scrapes the four services inside docker compose.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: ceditor
    # Matches METRICS_TOKEN set for the services in docker-compose.yml (local-only value)
    authorization:
      type: Bearer
      credentials: local-dev-metrics-token
    static_configs:
      - targets: ['api-gateway:3000', 'identity-service:3001', 'code-service:3003', 'contest-service:3004']
