name: ceditor

# Local development stack: all infrastructure runs in containers, nothing touches production.
# Each app loads its own <service>/.env, shared secrets come from the root .env,
# and the addresses below override localhost values with container hostnames.

x-app-healthcheck: &app-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      # Each check starts a mongosh process (~150-200 MB for a moment): poll quickly only
      # while starting, then every 30s
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s

  redis:
    # Plain Redis, like production (Upstash); the code uses no Redis Stack modules.
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The image default reserves a 1 GB heap; a few dev topics need far less
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # Creates the topics (names from @ceditor/contracts), so consumers never start before their topic exists.
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        for t in identity.user-events contest.events dead-letter; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$t" --partitions 1 --replication-factor 1 || exit 1
        done
    depends_on:
      kafka:
        condition: service_healthy

  # Metrics: docker compose --profile observability up -d
  # Prometheus http://localhost:9090, Grafana http://localhost:3010 (dashboard "CEditor services")
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    profiles: [ observability ]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    profiles: [ observability ]
    ports:
      - "3010:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/ceditor.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # Optional UIs: docker compose --profile tools up -d
  redis-insight:
    image: redis/redisinsight:2.58
    container_name: redis-insight
    profiles: [ tools ]
    ports:
      - "5540:5540"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    profiles: [ tools ]
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=localCluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: on-failure
    ports:
      - "3000:3000"
    env_file: ./api-gateway/.env
    environment:
      - METRICS_TOKEN=local-dev-metrics-token
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET}
      - USER_TOKEN_PRIVATE_KEY=${USER_TOKEN_PRIVATE_KEY}
      - USER_TOKEN_PUBLIC_KEY=${USER_TOKEN_PUBLIC_KEY}
      - REDIS_URL=redis://redis:6379
      - IDENTITY_SERVICE_URL=http://identity-service:3001
      - CODE_SERVICE_URL=http://code-service:3003
      - CONTEST_SERVICE_URL=http://contest-service:3004
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      code-service:
        condition: service_healthy
      contest-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      <<: *app-healthcheck

  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    container_name: identity-service
    restart: on-failure
    ports:
      - "3001:3001"
    env_file: ./identity-service/.env
    environment:
      - METRICS_TOKEN=local-dev-metrics-token
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET}
      - USER_TOKEN_PUBLIC_KEY=${USER_TOKEN_PUBLIC_KEY}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      # Low so scripts/smoke.sh can check the lockout quickly (default 10)
      - LOGIN_MAX_FAILURES=3
      # Tests and local development sign up with email (off by default, i.e. in production)
      - EMAIL_SIGN_UP=true
      - DATABASE_URL=mongodb://mongo:27017/ceditor_auth
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKER=kafka:9092
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      <<: *app-healthcheck

  code-service:
    build:
      context: .
      dockerfile: code-service/Dockerfile
    container_name: code-service
    restart: on-failure
    ports:
      - "3003:3003"
    env_file: ./code-service/.env
    environment:
      - METRICS_TOKEN=local-dev-metrics-token
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET}
      - USER_TOKEN_PUBLIC_KEY=${USER_TOKEN_PUBLIC_KEY}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - DATABASE_URL=mongodb://mongo:27017/ceditor_code
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKER=kafka:9092
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3003/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      <<: *app-healthcheck


  contest-service:
    build:
      context: .
      dockerfile: contest-service/Dockerfile
    container_name: contest-service
    restart: on-failure
    ports:
      - "3004:3004"
    env_file: ./contest-service/.env
    environment:
      - METRICS_TOKEN=local-dev-metrics-token
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET}
      - USER_TOKEN_PUBLIC_KEY=${USER_TOKEN_PUBLIC_KEY}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - DATABASE_URL=mongodb://mongo:27017/ceditor_contest
      - KAFKA_BROKER=kafka:9092
    depends_on:
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3004/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      <<: *app-healthcheck

volumes:
  mongo_data:
  redis_data:
