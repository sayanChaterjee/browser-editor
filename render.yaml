envVarGroups:
  - name: internal-security-group
    envVars:
      - key: INTERNAL_GATEWAY_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: KAFKAJS_NO_PARTITIONER_WARNING
        value: "1"

  - name: kafka-certificates
    # Secret Files (ca.pem, service.key, service.cert) should be added to this group in Render UI

services:
  # 1. API GATEWAY (Public)
  - type: web
    name: api-gateway
    runtime: docker
    # Builds from the repo root: npm workspaces share one lockfile and packages/common
    dockerContext: .
    dockerfilePath: ./api-gateway/Dockerfile
    # Only redeploy when this service or shared code changes (replaces rootDir)
    buildFilter:
      paths:
        - api-gateway/**
        - packages/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
    plan: free
    envVars:
      - fromGroup: internal-security-group
      - key: PORT
        value: 10000
      # Public URLs on purpose: free-tier Render services can't receive private-network
      # traffic, and `fromService: host` yields a port-less internal hostname. Blueprint
      # syncs re-apply these values, so they must be the working ones.
      - key: IDENTITY_SERVICE_URL
        value: https://identity-service-ltmg.onrender.com
      - key: CODE_SERVICE_URL
        value: https://code-service-2aa7.onrender.com
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false # Set this to your Vercel frontend URL
      - key: LOG_LEVEL
        value: info
      # Client IP for rate limiting: the Vercel /api proxy vouches for it with this
      # secret (same value as BFF_SHARED_SECRET in Vercel); direct callers are keyed by
      # Cloudflare's CF-Connecting-IP, which Render's Cloudflare edge always overwrites.
      - key: BFF_SHARED_SECRET
        sync: false
      - key: TRUST_CF_CONNECTING_IP
        value: "true"

  # 2. IDENTITY SERVICE (Public - Web Type for Free Tier): sign-in, sessions, profiles, moderation
  - type: web
    name: identity-service
    runtime: docker
    # Builds from the repo root: npm workspaces share one lockfile and packages/common
    dockerContext: .
    dockerfilePath: ./identity-service/Dockerfile
    # Only redeploy when this service or shared code changes (replaces rootDir)
    buildFilter:
      paths:
        - identity-service/**
        - packages/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
    plan: free
    envVars:
      - fromGroup: internal-security-group
      - fromGroup: kafka-certificates
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: KAFKA_BROKER
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false # Set this to your Vercel frontend URL
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false # Vercel frontend URL
      - key: ALLOWED_ORIGINS
        sync: false # Vercel frontend URL
      - key: ADMIN_EMAILS
        sync: false # comma-separated
      - key: LOG_LEVEL
        value: info

  # 3. CODE SERVICE (Public - Web Type for Free Tier)
  - type: web
    name: code-service
    runtime: docker
    # Builds from the repo root: npm workspaces share one lockfile and packages/common
    dockerContext: .
    dockerfilePath: ./code-service/Dockerfile
    # Only redeploy when this service or shared code changes (replaces rootDir)
    buildFilter:
      paths:
        - code-service/**
        - packages/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
    plan: free
    envVars:
      - fromGroup: internal-security-group
      - fromGroup: kafka-certificates
      - key: PORT
        value: 3003
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: KAFKA_BROKER
        sync: false
      - key: LOG_LEVEL
        value: info
