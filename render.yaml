envVarGroups:
  - name: internal-security-group
    envVars:
      - key: INTERNAL_GATEWAY_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: KAFKAJS_NO_PARTITIONER_WARNING
        value: "1"

  - name: kafka-certificates
    # Secret Files (ca.pem, service.key, service.cert) should be added to this group in Render UI

services:
  # 1. API GATEWAY (Public)
  - type: web
    name: api-gateway
    runtime: docker
    rootDir: api-gateway
    plan: free
    envVars:
      - fromGroup: internal-security-group
      - key: PORT
        value: 10000
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: auth-service
          property: host
      - key: USER_SERVICE_URL
        fromService:
          type: web
          name: user-service
          property: host
      - key: CODE_SERVICE_URL
        fromService:
          type: web
          name: code-service
          property: host
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false # Set this to your Vercel frontend URL
      - key: LOG_LEVEL
        value: info

  # 2. AUTH SERVICE (Public - Web Type for Free Tier)
  - type: web
    name: auth-service
    runtime: docker
    rootDir: auth-service
    plan: free
    envVars:
      - fromGroup: internal-security-group
      - fromGroup: kafka-certificates
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: KAFKA_BROKER
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false # Set this to your Vercel frontend URL
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info

  # 3. CODE SERVICE (Public - Web Type for Free Tier)
  - type: web
    name: code-service
    runtime: docker
    rootDir: code-service
    plan: free
    envVars:
      - fromGroup: internal-security-group
      - fromGroup: kafka-certificates
      - key: PORT
        value: 3003
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: KAFKA_BROKER
        sync: false
      - key: LOG_LEVEL
        value: info

  # 4. USER SERVICE (Public - Web Type for Free Tier)
  - type: web
    name: user-service
    runtime: docker
    rootDir: user-service
    plan: free
    envVars:
      - fromGroup: internal-security-group
      - fromGroup: kafka-certificates
      - key: PORT
        value: 3002
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: KAFKA_BROKER
        sync: false
      - key: LOG_LEVEL
        value: info
