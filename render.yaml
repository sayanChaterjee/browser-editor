services:
  # 1. API GATEWAY (Public)
  - type: web
    name: api-gateway
    runtime: docker
    rootDir: api-gateway
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: AUTH_SERVICE_URL
        value: http://auth-service:3001
      - key: USER_SERVICE_URL
        value: http://user-service:3002
      - key: CODE_SERVICE_URL
        value: http://code-service:3003
      - key: INTERNAL_GATEWAY_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false # Set this to your Vercel frontend URL
      - key: LOG_LEVEL
        value: info

  # 2. AUTH SERVICE (Public - will be proxied by gateway, but Render Free Tier requires web type)
  - type: web
    name: auth-service
    runtime: docker
    rootDir: auth-service
    plan: free
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL # MongoDB Atlas URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: KAFKA_BROKER
        sync: false
      - key: INTERNAL_GATEWAY_SECRET
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false # Set this to your Vercel frontend URL
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info

  # 3. CODE SERVICE (Public - will be proxied by gateway, but Render Free Tier requires web type)
  - type: web
    name: code-service
    runtime: docker
    rootDir: code-service
    plan: free
    envVars:
      - key: PORT
        value: 3003
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: KAFKA_BROKER
        sync: false
      - key: INTERNAL_GATEWAY_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info

  # 4. USER SERVICE (Public - will be proxied by gateway, but Render Free Tier requires web type)
  - type: web
    name: user-service
    runtime: docker
    rootDir: user-service
    plan: free
    envVars:
      - key: PORT
        value: 3002
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: KAFKA_BROKER
        sync: false
      - key: INTERNAL_GATEWAY_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info
